<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="Full_Name">Full Name</label>
            <input 
            type="text"
            id="Full_Name"
            name="Full_Name"
            required
            minlength="2" 
            >

            <br>
            <br>

            <label for="email">Email</label>
            <input 
            type="email"
            id="email"
            name="email"
            required
             >

               <br>
            <br>

            <label for="phone">Phone</label>
            <input 
            type="tel"
            id="phone"
            name="phone"
            required
             >


        </fieldset>
        <fieldset>
            <legend>Ticket & Workshops</legend>

            <label for="Ticket_type">Ticket type</label>
            <select id="Ticket_type" name="Ticket_type" required>

              <option value="st">Standard</option>
              <option value="vip">VIP</option>
              <option value="stu">Student</option>
            
            </select>

            <br> <br>

            <label for="Workshops">Workshops</label>

            <br><br>

            <label for="Web_Performance">Web Performance</label>
            <input type="checkbox" id="Web_Performance" name="Workshops" value="Web_Performance">

            <label for="Accessibility">Accessibility</label>
            <input type="checkbox" id="Accessibility" name="Workshops" value="Accessibility">

            <label for="Testing">Testing</label>
            <input type="checkbox" id="Testing" name="Workshops" value="Testing">

            <br><br>

            <label for="Diet">Diet</label>

            <br><br>

            <label for="none">None</label>
            <input type="radio" id="none" name="Diet " value="n" >

            <label for="vegan">Vegan</label>
            <input type="radio" id="vegan" name="Diet " value="d" >

            <label for="kosher">Kosher</label>
            <input type="radio" id="kosher" name="Diet " value="k" >

            <label for="halal">Halal</label>
            <input type="radio" id="halal" name="Diet " value="h" >

            <label for="other">Other</label>
            <input type="radio" id="other" name="Diet " value="o" >

            <br> <br>


        </fieldset>
        <fieldset>
            <legend>Payment Details</legend>

            <label for="card_number">Card number</label>
            <input 
            type="text"
            id="card_number"
            name="card_number"
            pattern="[0-9 ]*"
            maxlength="19" 
            minlength="13">

             <br> <br>

            <label for="date">Date</label>
            <input type="datetime" id="date" name="date">

             <br> <br>

            <label for="cvv">CVV</label>
            <input type="password" id="cvv" name="cvv" minlength="3" maxlength="4">

        </fieldset>
        <fieldset>
            <legend>Agreements</legend>
        </fieldset>
    </form>
</body>
</html>
